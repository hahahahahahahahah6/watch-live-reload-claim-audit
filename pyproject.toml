[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "watch-live-reload-claim-audit"
version = "0.1.0"
description = "Offline audit of documented filesystem observation behavior"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "watch-live-reload-claim-audit contributors"}]
dependencies = []

[project.scripts]
watch-live-reload-claim-audit = "watch_live_reload_claim_audit:main"

[tool.setuptools.packages.find]
where = ["src"]
